<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Masoodi EV Motors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-page">

    <main class="admin-login-section">

        <div class="admin-login-card">

            <div class="admin-login-header">
                <div class="admin-logo">ME</div>

                <h1>Forgot Password?</h1>

                <p>
                    Enter your admin email address and we will send you a password reset link.
                </p>
            </div>

            <form class="admin-login-form">

                <div class="form-group">
                    <label for="admin-email">Admin Email Address</label>

                    <input type="email" id="admin-email" name="email" placeholder="Enter admin email" required>
                </div>

                <button type="submit" class="admin-login-button">
                    Send Reset Link
                </button>

            </form>

            <a href="admin-login.html" class="back-to-website">
                ← Back to Admin Login
            </a>

        </div>

    </main>

</body>

</html>
